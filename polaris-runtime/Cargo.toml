[package]
name = "polaris-runtime"
version = "0.1.0"
edition = "2021"
description = "In-process POLARIS CUDA VMM executor runtime for inference engines"

[lib]
name = "polaris_runtime"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
libpolaris = { path = "../libpolaris" }
libc = "0.2"
cudarc = { version = "0.19.4", features = ["cuda-13020"] }
