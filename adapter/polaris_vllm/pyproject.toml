[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polaris-vllm"
version = "0.1.0"
description = "POLARIS kernel module integration adapter for vLLM v1"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
dependencies = [
    # vLLM is *not* listed as a hard dependency so that the adapter can be
    # installed in environments where vLLM is already present (e.g. Docker
    # images, conda envs, or editable installs from source).
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polaris_vllm*"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]  # line too long — we have C struct definitions

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
