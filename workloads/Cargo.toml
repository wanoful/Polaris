[package]
name = "workloads"
version = "0.1.0"
edition = "2021"
description = "POLARIS workload generators — synthetic KV allocation, beam search, trace replay"

[[bin]]
name = "polaris-workload"
path = "src/main.rs"

[dependencies]
libpolaris = { path = "../libpolaris" }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.19.4", features = ["cuda-13020"] }
