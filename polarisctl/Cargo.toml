[package]
name = "polarisctl"
version = "0.1.0"
edition = "2021"
description = "POLARIS CLI — inspect and control the POLARIS kernel module"

[[bin]]
name = "polarisctl"
path = "src/main.rs"

[dependencies]
libpolaris = { path = "../libpolaris" }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
